<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>現代國家的挑戰與變局：歷史時間軸</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
        }
        .timeline-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 1rem;
            height: 100%;
            width: 4px;
            background: #cbd5e1;
            border-radius: 2px;
        }
        @media (min-width: 768px) {
            .timeline-container::before {
                left: 50%;
                transform: translateX(-50%);
            }
        }
        .highlight {
            font-weight: 700;
            color: #b91c1c;
            background-color: #fee2e2;
            padding: 0 4px;
            border-radius: 4px;
        }
        
        /* 動畫效果 */
        .timeline-item {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease-out;
        }
        .timeline-item.visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body class="text-slate-800">

    <!-- Header -->
    <header class="bg-slate-900 text-white py-12 px-4 text-center shadow-lg relative overflow-hidden">
        <div class="relative z-10 max-w-4xl mx-auto">
            <h1 class="text-4xl md:text-5xl font-black mb-4 tracking-wider">現代國家的挑戰與變局</h1>
            <p class="text-xl md:text-2xl text-slate-300 mb-8">從北伐統一到政府遷臺 (1921 - 1949)</p>
            
            <!-- Filters -->
            <div class="flex flex-wrap justify-center gap-3" id="filters">
                <button onclick="filterTimeline('all')" class="filter-btn active bg-slate-700 hover:bg-slate-600 text-white px-6 py-2 rounded-full font-bold transition shadow" data-category="all">
                    <i class="fas fa-globe-asia mr-2"></i>全部事件
                </button>
                <button onclick="filterTimeline('kmt-ccp')" class="filter-btn bg-blue-100 hover:bg-blue-200 text-blue-800 border border-blue-300 px-4 py-2 rounded-full font-bold transition shadow" data-category="kmt-ccp">
                    <i class="fas fa-handshake mr-2"></i>國共發展
                </button>
                <button onclick="filterTimeline('war')" class="filter-btn bg-red-100 hover:bg-red-200 text-red-800 border border-red-300 px-4 py-2 rounded-full font-bold transition shadow" data-category="war">
                    <i class="fas fa-fire mr-2"></i>中日衝突
                </button>
                <button onclick="filterTimeline('intl')" class="filter-btn bg-emerald-100 hover:bg-emerald-200 text-emerald-800 border border-emerald-300 px-4 py-2 rounded-full font-bold transition shadow" data-category="intl">
                    <i class="fas fa-globe mr-2"></i>國際局勢
                </button>
                <button onclick="filterTimeline('domestic')" class="filter-btn bg-purple-100 hover:bg-purple-200 text-purple-800 border border-purple-300 px-4 py-2 rounded-full font-bold transition shadow" data-category="domestic">
                    <i class="fas fa-landmark mr-2"></i>內政建設
                </button>
            </div>
        </div>
        <div class="absolute inset-0 opacity-10 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]"></div>
    </header>

    <!-- Timeline Content -->
    <main class="max-w-6xl mx-auto py-12 px-4 sm:px-6 lg:px-8">
        <div class="relative timeline-container" id="timeline-container">
            <!-- 內容由 JavaScript 動態生成 -->
        </div>
    </main>

    <footer class="bg-slate-800 text-slate-400 text-center py-6">
        <p>整理自：余老師講義 (第三課~第四課) | 重點筆記互動時間軸</p>
    </footer>

        // 高光關鍵字處理函數
        function highlightKeywords(text) {
            // 使用正規表達式匹配【】內的文字並加上 span
            return text.replace(/【(.*?)】/g, '<span class="highlight">【$1】</span>');
        }

        // 渲染時間軸
        function renderTimeline(filter = 'all') {
            const container = document.getElementById('timeline-container');
            container.innerHTML = '';

            let delay = 0;
            let alignLeft = true;

            timelineData.forEach((item, index) => {
                if (filter !== 'all' && item.category !== filter) return;

                const alignmentClass = alignLeft ? 'md:flex-row-reverse' : 'md:flex-row';
                const textAlignment = alignLeft ? 'md:text-right md:pr-12' : 'md:text-left md:pl-12';
                const nodePosition = alignLeft ? 'md:right-0 md:translate-x-1/2' : 'md:left-0 md:-translate-x-1/2';
                const paddingClass = alignLeft ? 'pr-8 md:pr-0 md:pl-12' : 'pl-8 md:pl-0 md:pr-12';

                const html = `
                    <div class="relative flex flex-col md:flex-row items-center mb-12 w-full timeline-item" style="transition-delay: ${delay}ms">
                        
                        <!-- Timeline Line (Mobile override) -->
                        <div class="absolute left-4 md:left-1/2 h-full w-1 bg-slate-200 transform -translate-x-1/2 -z-10 block md:hidden"></div>
                        
                        <!-- Content Box (Left or Right on Desktop) -->
                        <div class="w-full md:w-1/2 pl-12 pr-4 md:px-0 ${alignLeft ? 'md:pr-12' : 'md:pl-12'}">
                            <div class="bg-white rounded-xl shadow-lg border-t-4 ${item.borderColor.replace('border-', 'border-t-')} p-6 hover:shadow-xl transition relative overflow-hidden group">
                                <div class="absolute top-0 right-0 w-16 h-16 ${item.color} opacity-10 rounded-bl-full transform group-hover:scale-125 transition duration-300"></div>
                                <h3 class="text-xl font-black mb-1 ${item.textColor}">${item.title}</h3>
                                <p class="text-sm font-bold text-slate-500 mb-3 tracking-wider bg-slate-100 inline-block px-2 py-1 rounded"><i class="far fa-clock mr-1"></i>${item.year}</p>
                                <p class="text-slate-700 leading-relaxed">${highlightKeywords(item.content)}</p>
                            </div>
                        </div>

                        <!-- Center Node -->
                        <div class="absolute left-4 md:left-1/2 transform -translate-x-1/2 w-10 h-10 rounded-full border-4 border-white ${item.color} shadow-md flex items-center justify-center z-10 text-white shadow-lg">
                            <i class="fas ${item.icon} text-sm"></i>
                        </div>
                    </div>
                `;
                
                container.innerHTML += html;
                delay += 100; // 錯開動畫時間
                alignLeft = !alignLeft; // 交替左右
            });

            // 觸發進場動畫
            setTimeout(() => {
                const items = document.querySelectorAll('.timeline-item');
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('visible');
                        }
                    });
                }, { threshold: 0.1 });

                items.forEach(item => observer.observe(item));
            }, 50);
        }

        // 篩選按鈕邏輯
        function filterTimeline(category) {
            // 更新按鈕樣式
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn.dataset.category === category) {
                    btn.classList.add('ring-2', 'ring-offset-2', 'ring-slate-400');
                    btn.style.transform = "scale(1.05)";
                } else {
                    btn.classList.remove('ring-2', 'ring-offset-2', 'ring-slate-400');
                    btn.style.transform = "scale(1)";
                }
            });

            // 重新渲染
            renderTimeline(category);
        }

        // 初始渲染
        document.addEventListener('DOMContentLoaded', () => {
            filterTimeline('all');
        });

    </script>
</body>
</html>
