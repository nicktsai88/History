<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歷史第4冊：L4 中日戰爭與國共內戰</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <!-- Firebase Import Map -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"
            }
        }
    </script>

    <style>
        :root {
            /* 配色系統 - 根據 image_0a3d05.png 重新設計的粉嫩可愛風格 */
            --primary-color: #ff4b6e;   /* 主題粉紅/紅色 (標題與按鈕) */
            --secondary-color: #ffebee; /* 淡粉背景 (標籤與框線) */
            --bg-color: #ffffff;        /* 純白 */
            --text-color: #4a4a4a;      /* 墨黑 (內文) */
            --accent-color: #ff8a80;    /* 點綴粉 */
            --correct-color: #4ade80;   /* 正確綠 */
            --wrong-color: #fb7185;     /* 錯誤紅 */
            --locked-color: #f1f5f9;    /* 封鎖灰 */
            --favorite-color: #f472b6;  /* 典藏粉 */
            --quick-mode-color: #ff4b6e; /* 統一使用主題粉 */
            --quick-mode-bg: #fffcfd;    /* 超淺粉白背景 */
            --header-height: 40px; 
        }

        body { 
            font-family: 'Noto Sans TC', "Microsoft JhengHei", Arial, sans-serif; 
            margin: 0; 
            padding: calc(var(--header-height) + 40px) 20px 40px 20px; 
            background-color: var(--bg-color); 
            color: var(--text-color);
            /* 點點圖案背景 (藍色與粉色交錯) */
            background-image: 
                radial-gradient(#e1f5fe 2px, transparent 2px),
                radial-gradient(#fce4ec 2px, transparent 2px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        h1, h2, h3 { text-align: center; color: var(--text-color); }
        h1 { 
            color: var(--primary-color); 
            font-size: 2.2em; 
            font-weight: 900; 
            margin-bottom: 5px; 
            text-shadow: none; 
            line-height: 1.3;
        }

        /* --- 頂部狀態列 (右上角小藥丸標籤) --- */
        #top-status-bar {
            position: fixed; top: 15px; right: 20px;
            display: flex; align-items: center; justify-content: flex-end;
            z-index: 10000;
        }

        .status-indicator {
            display: flex; align-items: center; gap: 6px;
            background: #ffffff; padding: 6px 14px;
            border-radius: 50px; 
            font-size: 0.85em; color: #666;
            border: 1px solid #fce4ec;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .status-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background-color: #ccc; transition: background-color 0.3s;
        }
        .status-dot.loading { background-color: #ffb74d; animation: pulse 1s infinite; }
        .status-dot.success { background-color: #4ade80; }
        .status-dot.error { background-color: #fb7185; }

        /* --- 容器通用 (白色虛線圓角卡片) --- */
        .container-box {
            background: #ffffff; 
            padding: 40px 30px; 
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04); 
            border: 2px dashed #ffd1d9;
            width: 100%;
            max-width: 460px; /* 貼近截圖中偏窄高的卡片比例 */
            margin: 0 auto 20px auto;
            box-sizing: border-box;
            position: relative;
        }
        #level-screen { max-width: 600px; }
        #waterfall-screen { max-width: 800px; }

        /* --- Welcome Screen 專屬字體與排版 --- */
        .pill-subtitle {
            display: inline-block;
            background: var(--secondary-color);
            color: #d81b60;
            padding: 6px 18px;
            border-radius: 50px;
            font-size: 0.9em;
            font-weight: bold;
            margin: 15px 0;
        }

        /* 隱藏預設頭像列，使其變小且精緻 */
        .avatar-selection { display: flex; justify-content: center; gap: 10px; margin: 10px 0; }
        .avatar-option {
            width: 40px; height: 40px; border-radius: 50%; border: 2px solid transparent; cursor: pointer;
            transition: 0.3s; object-fit: cover; background: #FFF; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .avatar-option.selected { border-color: var(--primary-color); transform: scale(1.1); }
        
        /* 雲端登入列表 */
        .quick-login-area { 
            display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 10px; 
            max-height: 120px; overflow-y: auto; padding: 5px; 
            border: none; background: transparent;
        }
        .user-tag { 
            background: #fff; border: 1px solid #f0f0f0; padding: 6px 16px; 
            border-radius: 50px; cursor: pointer; display: flex; align-items: center; gap: 6px; 
            font-size: 0.85em; transition: 0.2s; box-shadow: 0 2px 6px rgba(0,0,0,0.03);
            color: #666; font-weight: bold;
        }
        .user-tag:hover { border-color: var(--primary-color); color: var(--primary-color); }
        .user-tag img { display: none; } /* 隱藏小頭像以符合照片極簡風 */
        
        .delete-user { font-weight: bold; color: #ccc; margin-left: 4px;}
        .delete-user:hover { color: var(--wrong-color); }
        
        input[type="text"] { 
            padding: 14px; 
            font-size: 1em; 
            border: 2px solid var(--secondary-color); 
            border-radius: 50px; 
            width: 85%; 
            text-align: center; 
            margin: 5px 0;
            background: #ffffff;
            color: var(--text-color);
            transition: 0.2s;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.01);
            box-sizing: border-box;
        }
        input[type="text"]:focus { outline: none; border-color: var(--primary-color); background: #fffafa;}
        input::placeholder { color: #bdbdbd; }

        /* --- Dashboard (Level Screen) --- */
        #level-screen-content {
            display: flex; gap: 20px; align-items: stretch;
            min-height: 300px;
        }
        
        .dashboard-speed-zone {
            flex: 1; background: #ffffff; border-radius: 20px; padding: 30px;
            border: 2px dashed var(--secondary-color); display: flex; flex-direction: column; align-items: center;
            justify-content: center;
        }
        .speed-title { color: var(--quick-mode-color); font-size: 1.6em; font-weight: bold; margin-bottom: 15px; display: flex; align-items: center; gap: 8px;}
        .speed-big-btn {
            width: 80%; max-width: 400px; padding: 16px; border-radius: 50px; 
            background: linear-gradient(135deg, #ff8a80 0%, #ff5252 100%);
            color: white; font-size: 1.3em; border: none; cursor: pointer; font-weight: bold;
            box-shadow: 0 4px 12px rgba(255, 82, 82, 0.3); transition: 0.3s;
        }
        .speed-big-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(255, 82, 82, 0.4); }

        .dashboard-tools {
            margin-top: 20px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
            padding-top: 20px; border-top: 2px dashed #fce4ec;
        }
        
        /* --- Button Styles --- */
        .btn { padding: 10px 24px; border-radius: 50px; border: none; cursor: pointer; font-weight: bold; font-size: 1em; transition: 0.3s; box-shadow: 0 4px 10px rgba(255, 94, 120, 0.2); color: #fff; background: var(--primary-color); display: inline-flex; align-items: center; gap: 5px; justify-content: center;}
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(255, 94, 120, 0.3); }
        .btn-main {
            width: 85%;
            background: linear-gradient(135deg, #ff8a80 0%, #ff5252 100%);
            box-shadow: 0 4px 12px rgba(255, 82, 82, 0.3);
            padding: 14px 20px;
            font-size: 1.1em;
            margin-top: 10px;
        }
        .btn-red { background: var(--wrong-color); } 
        .btn-green { background: var(--correct-color); } 
        .btn-pink { background: var(--favorite-color); } 
        .btn-gray { background: #fff; color: #666; border: 1px solid #eee; box-shadow: none; } 
        .btn-gray:hover { background: #f9f9f9; transform: none; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .btn-orange { background: #ffa726; color: #fff;} 

        /* --- Waterfall Quiz Mode (Quick Quiz) --- */
        #waterfall-screen { display: none; }
        .waterfall-header {
            position: sticky; top: 10px; z-index: 99;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
            padding: 15px 20px; border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin: -25px -25px 20px -25px;
            border: 2px dashed var(--secondary-color);
            display: flex; justify-content: space-between; align-items: center;
        }
        .waterfall-title { font-size: 1.2em; font-weight: bold; color: var(--quick-mode-color); display: flex; align-items: center; gap: 8px; }
        .waterfall-stats { font-size: 1.1em; font-weight: bold; color: #666; }
        
        .waterfall-card {
            background: #fff; border-radius: 20px; padding: 25px; margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid #fce4ec; position: relative;
        }
        .waterfall-card.card-correct { background-color: #f0fdf4; border-color: var(--correct-color); }
        .waterfall-card.card-wrong { background-color: #fff1f2; border-color: var(--wrong-color); }
        .waterfall-card.locked { opacity: 0.95; }
        .card-actions { position: absolute; top: 15px; right: 15px; display: flex; gap: 10px; }
        .action-icon { cursor: pointer; font-size: 1.8em; transition: 0.2s; color: #e2e8f0; padding: 5px; }
        .action-icon.active { color: var(--favorite-color); }
        .action-icon.trash:hover { color: var(--wrong-color); }

        .wf-question-text { 
            font-size: 1.4em; font-weight: bold; margin-bottom: 20px; 
            padding-right: 80px; line-height: 1.5; color: var(--text-color); 
        }
        .wf-q-badge { display: inline-block; background: var(--secondary-color); color: var(--primary-color); padding: 4px 12px; border-radius: 50px; font-size: 0.8em; font-weight: bold; margin-right: 8px; vertical-align: middle; }
        .wf-img { max-width: 100%; max-height: 400px; display: block; margin: 10px auto; border-radius: 12px; border: 1px solid #eee; }
        
        .wf-options { display: grid; grid-template-columns: 1fr; gap: 10px; }
        .wf-opt-btn {
            padding: 14px; border: 2px solid #f8fafc; background: #f8fafc; border-radius: 16px;
            text-align: left; cursor: pointer; font-size: 1.2em; transition: 0.2s; color: var(--text-color); font-weight: 500;
        }
        .wf-opt-btn:hover:not(:disabled) { border-color: var(--secondary-color); background: #fff; }
        .wf-opt-btn.correct { background: #f0fdf4; border-color: var(--correct-color); color: #166534; font-weight: bold;}
        .wf-opt-btn.wrong { background: #fff1f2; border-color: var(--wrong-color); color: #9f1239; }
        
        .wf-explanation {
            margin-top: 20px; background: #fffafb; padding: 20px; 
            border-radius: 16px; border: 1px solid #fce4ec;
            font-size: 1.1em; color: #666; display: none;
        }

        /* Animations */
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        /* RWD */
        @media (max-width: 768px) {
            #level-screen-content { flex-direction: column; }
            .waterfall-header { flex-direction: column; align-items: flex-start; gap: 8px; top: 10px; margin-top: -15px;} 
            .waterfall-stats { font-size: 0.9em; align-self: flex-end; }
            .card-actions { top: 10px; right: 10px; }
            body { padding-top: 60px; }
            
            #top-status-bar { top: 10px; right: 10px; }
            #status-text { display: none; } /* 手機版狀態燈只顯示圓點 */
        }
    </style>
</head>
<body>

    <!-- 頂部狀態列 (僅保留連線狀態，改為右上角小標籤) -->
    <div id="top-status-bar">
        <div id="cloud-status" class="status-indicator">
            <div id="status-dot" class="status-dot"></div>
            <span id="status-text">連線同步中</span>
        </div>
    </div>

    <!-- 歡迎畫面 -->
    <div id="welcome-screen" class="container-box fade-in">
        <!-- 頂部的主視覺小頭像 -->
        <div style="text-align: center; margin-bottom: 5px;">
            <img src="History4-L4-images/Chris.png" id="main-cute-avatar" style="width: 55px; height: 55px; border-radius: 50%; object-fit: cover; background: #ffebee; padding: 4px;">
        </div>

        <h1 style="margin-top: 10px;">歷史第4冊<br>中日戰爭與內戰</h1>
        <div style="font-size: 1.8em; text-align: center; margin: 5px;">🌈✨</div>
        
        <div style="text-align: center;">
            <div class="pill-subtitle">準備參加歷史戰爭 💡</div>
        </div>
        
        <div style="text-align:center; margin-top: 10px;">
            <input type="text" id="username" placeholder="✍️ 點擊這裡輸入代號進入" />
        </div>
        
        <!-- 頭像選擇區縮小並作為輔助 -->
        <div class="avatar-selection">
            <img src="History4-L4-images/Chris.png" class="avatar-option selected" onclick="selectAvatar('Chris.png', this); document.getElementById('main-cute-avatar').src=this.src;">
            <img src="History4-L4-images/Louis.png" class="avatar-option" onclick="selectAvatar('Louis.png', this); document.getElementById('main-cute-avatar').src=this.src;">
            <img src="History4-L4-images/kitty.png" class="avatar-option" onclick="selectAvatar('kitty.png', this); document.getElementById('main-cute-avatar').src=this.src;">
        </div>

        <div style="text-align:center; margin-top: 10px;">
            <button class="btn btn-main" onclick="loginAndStart()">進入學習 / 測驗 🚀</button>
        </div>

        <div style="text-align: center; margin-top: 25px; color: #a0aab2; font-size: 0.85em; font-weight: bold;">
            ☁️ 雲端最近登入 👥
        </div>
        <div id="quick-login-area" class="quick-login-area">
            <div style="color:#bbb; padding:10px; font-size: 0.9em;">資料載入中...</div>
        </div>

        <div style="margin-top: 15px; text-align: center;">
            <a href="index.html" class="btn btn-gray" style="text-decoration: none; padding: 8px 16px; font-size: 0.85em;">
                🏠 返回總部
            </a>
        </div>
    </div>

    <!-- 儀表板 (Level Screen) -->
    <div id="level-screen" class="container-box fade-in" style="display: none;">
        <div style="text-align: center; margin-bottom: 20px;">
            <img id="user-avatar-display" src="" style="width:40px; height:40px; border-radius:50%; vertical-align:middle; border:2px solid #fff; box-shadow:0 2px 5px rgba(0,0,0,0.2);">
            <span style="font-size: 1.2em; font-weight: bold; margin-left: 10px;">探險家：<span id="display-name" style="color:var(--primary-color);"></span></span>
        </div>

        <div id="level-screen-content">
            <!-- 極速刷題區 -->
            <div class="dashboard-speed-zone">
                <div class="speed-title">⚡ 歷史速讀區</div>
                <p style="color:#666; font-size:1.1em; text-align:center; margin-bottom: 20px;">不分章節，瀑布流快速複習全部歷史題目</p>
                <button class="speed-big-btn" onclick="startWaterfallQuiz('speed')">🚀 開始探索</button>
            </div>
        </div>

        <!-- 底部工具列 (移除了文物圖鑑與名人堂) -->
        <div class="dashboard-tools">
            <button id="btn-mistake" class="btn btn-red" onclick="startWaterfallQuiz('mistake')" style="display:none;">📕 錯題筆記 (<span id="mistake-count">0</span>)</button>
            <button id="btn-favorite" class="btn btn-pink" onclick="startWaterfallQuiz('favorite')" style="display:none;">⭐ 趨勢收藏 (<span id="favorite-count">0</span>)</button>
            <a href="History4-L4.html" class="btn btn-gray" style="text-decoration: none;">🚪 返回總部</a>
        </div>
    </div>

    <!-- 瀑布流刷題介面 (Waterfall) -->
    <div id="waterfall-screen" class="container-box fade-in">
        <div class="waterfall-header">
            <div class="waterfall-title">
                <span id="wf-mode-icon">⚡</span> <span id="wf-mode-title">歷史速讀</span>
            </div>
            <div class="waterfall-stats">
                已答: <span id="wf-answered" style="color:var(--primary-color)">0</span> / <span id="wf-total">0</span>
                &nbsp;|&nbsp; 得分: <span id="wf-score" style="color:var(--correct-color)">0</span>
            </div>
            <div style="display:flex; gap: 5px;">
                <button class="btn btn-orange btn-sm" onclick="restartQuiz()">🔄 重新開始</button>
                <button class="btn btn-gray btn-sm" onclick="exitQuiz()">🏠 結束</button>
            </div>
        </div>
        
        <div id="waterfall-list">
            <!-- 題目卡片將由 JS 生成 -->
        </div>
    </div>

    <script type="module">
        // ============================================
        // 0. Firebase 初始化與設定 (合併版)
        // ============================================
        import { initializeApp } from 'firebase/app';
        import { getAuth, signInAnonymously } from 'firebase/auth';
        import { getFirestore, collection, doc, setDoc, updateDoc, onSnapshot, arrayUnion, arrayRemove, getDoc } from 'firebase/firestore';

        // 請填入您的 Firebase 設定
        const firebaseConfig = {
          apiKey: "AIzaSyAxQFt76ZPXE7d0i1XeNZ1yiiD2WYNIfHs",
          authDomain: "chinese-learning-47f4d.firebaseapp.com",
          projectId: "chinese-learning-47f4d",
          storageBucket: "chinese-learning-47f4d.firebasestorage.app",
          messagingSenderId: "76289812052",
          appId: "1:76289812052:web:898384a916f9f341f62fc1"
        };

        let db, auth;
        let isFirebaseReady = false;
        
        // 設定 Collection Name
        const APP_PREFIX = 'History4-L4_';
        const COLLECTION_NAME = 'History4-L4'; 
        const DOC_GLOBAL = 'UserList'; // 儲存所有使用者的清單文件
        
        let currentUserDocUnsubscribe = null;
        let globalUsersUnsubscribe = null;

        // 全域資料快取 (移除了不必要的 quizHistory)
        window.currentUserData = {
            mistakeBank: [],
            favoriteBank: [],
            waterfallProgress_speed: null,
            waterfallProgress_mistake: null,
            waterfallProgress_favorite: null
        };

        // 初始化 Firebase
        function initFirebase() {
            try {
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                window.db = db; // Expose to window for potential debug or other script access
                
                window.updateConnectionStatus('loading');
                
                signInAnonymously(auth).then(() => {
                    isFirebaseReady = true;
                    console.log("Firebase Anonymous Auth Success");
                    window.updateConnectionStatus('success');
                    listenToGlobalUsers(); // 登入後監聽使用者列表
                }).catch((error) => {
                    console.error("Auth Error:", error);
                    window.updateConnectionStatus('error');
                    alert("無法連線至雲端資料庫，請檢查網路。");
                });

            } catch (e) {
                console.error("Firebase Init Error", e);
                window.updateConnectionStatus('error');
            }
        }
        
        // UI 狀態燈更新
        window.updateConnectionStatus = function(status) {
            const dot = document.getElementById('status-dot');
            const text = document.getElementById('status-text');
            
            dot.classList.remove('loading', 'success', 'error');
            
            if (status === 'loading') {
                dot.classList.add('loading');
                text.innerText = '讀取資料中...';
            } else if (status === 'success') {
                dot.classList.add('success');
                text.innerText = '已同步';
            } else if (status === 'error') {
                dot.classList.add('error');
                text.innerText = '雲端同步失敗';
            }
        };

        // 監聽全域使用者列表 (Login Screen 用)
        function listenToGlobalUsers() {
            const globalDocRef = doc(db, COLLECTION_NAME, DOC_GLOBAL);
            globalUsersUnsubscribe = onSnapshot(globalDocRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    window.renderQuickLogin(data.users || []);
                } else {
                    window.renderQuickLogin([]); // 若文件不存在，傳空陣列
                }
            }, (error) => {
                console.error("Listen Global Error:", error);
                window.updateConnectionStatus('error');
            });
        }
        
        // 儲存資料到雲端 (Helper) - 現在強制使用 window.userName
        window.updateUserData = async function(field, value) {
            if (!isFirebaseReady || !window.userName) {
                console.warn("Skipping save: Firebase not ready or no username set.");
                return;
            }
            
            window.updateConnectionStatus('loading');
            
            // 更新本地快取 (樂觀更新)
            window.currentUserData[field] = value;
            
            const userDocRef = doc(db, COLLECTION_NAME, window.userName);
            try {
                await setDoc(userDocRef, { [field]: value }, { merge: true });
                window.updateConnectionStatus('success');
            } catch (e) {
                console.error("Save Error:", e);
                window.updateConnectionStatus('error');
            }
        };

        // 監聽當前使用者資料
        window.listenToCurrentUser = function(name) {
             if (currentUserDocUnsubscribe) currentUserDocUnsubscribe(); // 取消舊的監聽
             
             window.updateConnectionStatus('loading');
             const userDocRef = doc(db, COLLECTION_NAME, name);
             
             currentUserDocUnsubscribe = onSnapshot(userDocRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    // 合併雲端資料到本地快取
                    window.currentUserData = { ...window.currentUserData, ...data };
                    
                    // --- 強制刷新畫面 ---
                    if (document.getElementById('level-screen').style.display === 'block') {
                        if (typeof window.updateDashboardTools === 'function') window.updateDashboardTools();
                        if(data.avatar && document.getElementById('user-avatar-display')) {
                             document.getElementById('user-avatar-display').src = "History4-L4-images/" + window.currentAvatar;
                        }
                    }

                    // 同步瀑布流進度
                    if (document.getElementById('waterfall-screen').style.display === 'block') {
                         const currentMode = window.quizState.mode;
                         const cloudProgress = window.currentUserData['waterfallProgress_' + currentMode];
                         
                         if (cloudProgress) {
                             window.quizState = cloudProgress;
                             window.updateWaterfallStats();
                         }
                    }
                    
                    window.updateConnectionStatus('success');
                } else {
                    // 新使用者，無資料
                    window.updateConnectionStatus('success');
                }
             }, (e) => {
                 console.error("User Sync Error:", e);
                 window.updateConnectionStatus('error');
             });
        }

        // 新增/更新全域使用者列表
        window.saveUserGlobal = async function() {
            if (!db) return; 
            if (!window.userName) return;

            const globalRef = doc(db, COLLECTION_NAME, DOC_GLOBAL);
            try {
                const snap = await getDoc(globalRef);
                const newUser = { name: window.userName, avatar: window.currentAvatar };
                
                if (snap.exists()) {
                    const users = snap.data().users || [];
                    const exists = users.some(u => u.name === window.userName);
                    if (!exists) {
                        await updateDoc(globalRef, { users: arrayUnion(newUser) });
                    }
                } else {
                    await setDoc(globalRef, { users: [newUser] });
                }
            } catch (e) {
                console.error("Global User Save Error", e);
            }
        };

        // 刪除使用者
        window.deleteUser = async function(name) {
             if(!confirm(`刪除 ${name} 的所有資料？`)) return;
             if (!db) return;
             const globalRef = doc(db, COLLECTION_NAME, DOC_GLOBAL);
             try {
                 const snap = await getDoc(globalRef);
                 if(snap.exists()) {
                     const users = snap.data().users || [];
                     const target = users.find(u => u.name === name);
                     if(target) {
                         await updateDoc(globalRef, { users: arrayRemove(target) });
                     }
                 }
             } catch(e) {
                 console.error("Delete Error", e);
                 alert("刪除失敗，請檢查網路");
             }
        };

        // 啟動
        initFirebase();
    </script>

    <script>
        // ============================================
        // 1. 設定與全域變數 (一般 JS)
        // ============================================

        let allQuestions = [];
        const ITEMS_PER_PAGE = 20; // 即使不用關卡，也保留作為常數備用
        
        // *** 關鍵修正：確保變數掛載到 window，讓 Module 讀得到 ***
        window.userName = ""; 
        window.currentAvatar = "Chris.png";
        
        // 測驗狀態 (僅保留瀑布流所需)
        let quizState = {
            mode: 'speed', 
            score: 0,
            answers: {}, 
            locked: {},
            qIds: []
        };

        const audioCorrect = new Audio('sounds/correct.mp3'); audioCorrect.volume = 0.4;
        const audioFail = new Audio('sounds/fail.mp3'); audioFail.volume = 0.4;

        // --- 初始化 ---
        document.addEventListener('DOMContentLoaded', () => {
            // 內建預設題庫，避免因為沙盒環境抓不到 JSON 而報錯
            const fallbackQuestions = [
                { id: "q1", question: "七七事變發生於哪一年？", options: ["A. 1931年", "B. 1937年", "C. 1945年", "D. 1949年"], answer: "B. 1937年", explanation: "1937年7月7日爆發盧溝橋事變，又稱七七事變。" },
                { id: "q2", question: "八年抗戰期間，中華民國政府遷都至何處？", options: ["A. 南京", "B. 北京", "C. 重慶", "D. 廣州"], answer: "C. 重慶", explanation: "抗戰爆發後，國民政府西遷重慶作為陪都。" },
                { id: "q3", question: "國共內戰中，三大戰役不包含下列何者？", options: ["A. 遼瀋戰役", "B. 淮海戰役(徐蚌會戰)", "C. 平津戰役", "D. 淞滬會戰"], answer: "D. 淞滬會戰", explanation: "淞滬會戰發生於對日抗戰期間(1937年)。" },
                { id: "q4", question: "中華民國政府於哪一年正式遷台？", options: ["A. 1945年", "B. 1947年", "C. 1949年", "D. 1950年"], answer: "C. 1949年", explanation: "1949年底，中華民國中央政府隨軍隊撤退至台灣。" }
            ];

            const initGameData = (data) => {
                allQuestions = data; 
                console.log(`Questions loaded: ${allQuestions.length}`);
            };

            // 使用 try...catch 保護 fetch，防止 Blob URL 環境解析失敗
            try {
                fetch('History4-L4-questions.json')
                    .then(res => {
                        if (!res.ok) throw new Error("HTTP Status: " + res.status);
                        return res.json();
                    })
                    .then(data => initGameData(data))
                    .catch(e => {
                        console.warn("無法載入外部題庫，啟用預設題庫。Error:", e);
                        initGameData(fallbackQuestions);
                    });
            } catch (e) {
                console.warn("Fetch URL 解析失敗 (沙盒環境限制)，啟用預設題庫。Error:", e);
                initGameData(fallbackQuestions);
            }
        });

        // ============================================
        // 3. 既有遊戲邏輯 (修改為 Firebase 版)
        // ============================================

        function selectAvatar(img, el) {
            window.currentAvatar = img; // *** FIX ***
            document.querySelectorAll('.avatar-option').forEach(e => e.classList.remove('selected'));
            el.classList.add('selected');
        }

        async function loginAndStart() {
            const name = document.getElementById('username').value.trim();
            if(!name) return alert('請輸入探險家代號');
            
            window.userName = name; // *** FIX: Set to window so module can see it ***
            
            // 這些函式現在是 window 的方法
            if(window.saveUserGlobal) await window.saveUserGlobal(); 
            if(window.listenToCurrentUser) window.listenToCurrentUser(window.userName);
            
            window.updateConnectionStatus('loading');
            setTimeout(() => {
                goToDashboard();
            }, 800);
        }

        // 我們需要重寫 renderQuickLogin 以支援捲軸和歡迎訊息
        window.renderQuickLogin = function(users) {
            const container = document.getElementById('quick-login-area');
            if (!container) return;
            if (users.length === 0) {
                container.innerHTML = `<div style="padding:20px; color:#666; width:100%; text-align:center;">尚無探險家紀錄，歡迎加入！</div>`;
                return;
            }
            
            container.innerHTML = users.map(u => `
                <div class="user-tag" onclick="quickLogin('${u.name}', '${u.avatar}')">
                    <img src="History4-L4-images/${u.avatar}" style="width:20px;height:20px;border-radius:50%;">${u.name}
                    <span class="delete-user" onclick="event.stopPropagation();deleteUser('${u.name}')">×</span>
                </div>
            `).join('');
        }

        function quickLogin(name, av) {
            document.getElementById('username').value = name;
            window.userName = name; // *** FIX ***
            window.currentAvatar = av; // *** FIX ***
            loginAndStart();
        }

        function deleteUser(name) {
            if(window.deleteUser) window.deleteUser(name);
        }

        // 接續一般 JS 邏輯

        function goToDashboard() {
            hideAllScreens();
            document.getElementById('level-screen').style.display = 'block';
            document.getElementById('display-name').innerText = window.userName;
            document.getElementById('user-avatar-display').src = "History4-L4-images/" + window.currentAvatar;
            
            updateDashboardTools();
        }

        function hideAllScreens() {
            document.querySelectorAll('.container-box').forEach(el => el.style.display = 'none');
        }

        // --- 瀑布流刷題模式 ---
        function startWaterfallQuiz(mode, forceNew = false) {
            const savedKey = 'waterfallProgress_' + mode;
            if(!forceNew && window.currentUserData[savedKey]) {
                const saved = window.currentUserData[savedKey];
                if(saved) {
                    quizState = saved;
                    renderWaterfallUI();
                    return;
                }
            }

            quizState = {
                mode: mode,
                score: 0,
                answers: {},
                locked: {}, 
                qIds: []
            };

            if(mode === 'speed') {
                quizState.qIds = allQuestions.map(q => q.id); 
                document.getElementById('wf-mode-title').innerText = "歷史速讀";
                document.getElementById('wf-mode-icon').innerText = "⚡";
            } else if(mode === 'mistake') {
                quizState.qIds = window.currentUserData.mistakeBank || [];
                document.getElementById('wf-mode-title').innerText = "錯題筆記";
                document.getElementById('wf-mode-icon').innerText = "📕";
            } else if(mode === 'favorite') {
                quizState.qIds = window.currentUserData.favoriteBank || [];
                document.getElementById('wf-mode-title').innerText = "趨勢收藏";
                document.getElementById('wf-mode-icon').innerText = "⭐";
            }

            if(quizState.qIds.length === 0) return alert("目前沒有題目！");
            
            renderWaterfallUI();
        }

        function renderWaterfallUI() {
            hideAllScreens();
            document.getElementById('waterfall-screen').style.display = 'block';
            window.updateWaterfallStats(); 
            
            const list = document.getElementById('waterfall-list');
            list.innerHTML = "";
            
            const questions = allQuestions.filter(q => quizState.qIds.includes(q.id));

            questions.forEach((q, idx) => {
                const card = document.createElement('div');
                card.className = 'waterfall-card';
                card.id = `card-${q.id}`;
                
                const isFav = isFavorite(q.id);
                const canDelete = (quizState.mode === 'mistake' || quizState.mode === 'favorite');
                
                let actionsHtml = `
                    <div class="card-actions">
                         ${canDelete ? `<span class="action-icon trash" onclick="deleteCardItem('${q.id}')">🗑️</span>` : ''}
                        <span class="action-icon ${isFav ? 'active' : ''}" onclick="toggleWaterfallFav(this, '${q.id}')">${isFav ? '♥&#xFE0E;' : '♡&#xFE0E;'}</span>
                    </div>
                `;
                
                let imgHtml = q.image ? `<img src="${q.image}" class="wf-img">` : '';
                let qTextHtml = `<div class="wf-question-text"><span class="wf-q-badge">#${idx+1}</span>${q.question}</div>`;

                let optionsHtml = '<div class="wf-options">';
                q.options.forEach(opt => {
                    let btnClass = 'wf-opt-btn';
                    let disabled = '';
                    
                    if(quizState.locked[q.id]) {
                        disabled = 'disabled';
                        const correct = q.answer.substring(0,3);
                        const val = opt.substring(0,3);
                        const userSel = quizState.answers[q.id] ? quizState.answers[q.id].substring(0,3) : null;
                        
                        if(val === correct) btnClass += ' correct';
                        if(userSel === val && userSel !== correct) btnClass += ' wrong';
                    }
                    
                    optionsHtml += `<button class="${btnClass}" ${disabled} onclick="handleWaterfallAnswer('${q.id}', '${opt}')">${opt}</button>`;
                });
                optionsHtml += '</div>';

                let expStyle = quizState.locked[q.id] ? 'display:block' : '';
                let expHtml = `<div class="wf-explanation" style="${expStyle}"><strong>💡 解析：</strong>${q.explanation||'略'}</div>`;

                card.innerHTML = actionsHtml + qTextHtml + imgHtml + optionsHtml + expHtml;
                list.appendChild(card);

                if(quizState.locked[q.id]) {
                    card.classList.add('locked');
                    const correct = q.answer.substring(0,3);
                    const userSel = quizState.answers[q.id] ? quizState.answers[q.id].substring(0,3) : '';
                    if(userSel === correct) card.classList.add('card-correct');
                    else card.classList.add('card-wrong');
                }
            });
            window.scrollTo(0, 0);
        }

        function handleWaterfallAnswer(qId, option) {
            if(quizState.locked[qId]) return;
            
            const qData = allQuestions.find(q => String(q.id) === String(qId));
            if(!qData) return;

            quizState.answers[qId] = option;
            quizState.locked[qId] = true;
            
            const correct = qData.answer.substring(0,3);
            const selected = option.substring(0,3);
            const card = document.getElementById(`card-${qId}`);

            if(selected === correct) {
                quizState.score++;
                audioCorrect.play().catch(()=>{});
                confetti({ particleCount: 50, origin: { y: 0.8 } });
                if(card) card.classList.add('card-correct');
            } else {
                audioFail.play().catch(()=>{});
                addToMistake(qId);
                if(card) card.classList.add('card-wrong');
            }
            
            if(window.updateUserData) window.updateUserData('waterfallProgress_' + quizState.mode, quizState);
            window.updateWaterfallStats();
            
            if(card) {
                card.classList.add('locked');
                const btns = card.querySelectorAll('.wf-opt-btn');
                btns.forEach(btn => {
                    btn.disabled = true;
                    const val = btn.innerText.substring(0,3);
                    if(val === correct) btn.classList.add('correct');
                    if(val === selected && val !== correct) btn.classList.add('wrong');
                });
                card.querySelector('.wf-explanation').style.display = 'block';
            }
        }

        // 掛載到 window 以供模組呼叫
        window.updateWaterfallStats = function() {
            if (!quizState || !quizState.locked) return;
            const answered = Object.keys(quizState.locked).length;
            const total = quizState.qIds.length;
            const scoreEl = document.getElementById('wf-score');
            const ansEl = document.getElementById('wf-answered');
            const totalEl = document.getElementById('wf-total');
            
            if(scoreEl) scoreEl.innerText = quizState.score;
            if(ansEl) ansEl.innerText = answered;
            if(totalEl) totalEl.innerText = total;
        }

        function addToMistake(id) {
            let list = window.currentUserData.mistakeBank || [];
            if(!list.includes(id)) {
                const newList = [...list, id];
                if(window.updateUserData) window.updateUserData('mistakeBank', newList);
                window.updateDashboardTools();
            }
        }

        function isFavorite(id) {
            let list = window.currentUserData.favoriteBank || [];
            return list.includes(id);
        }

        function toggleWaterfallFav(btn, id) {
            let list = window.currentUserData.favoriteBank || [];
            let newList;
            
            if(list.includes(id)) {
                newList = list.filter(x => x !== id);
                btn.classList.remove('active');
                btn.innerHTML = '♡&#xFE0E;';
            } else {
                newList = [...list, id];
                btn.classList.add('active');
                btn.innerHTML = '♥&#xFE0E;';
            }
            if(window.updateUserData) window.updateUserData('favoriteBank', newList);
            window.updateDashboardTools();
        }

        window.updateDashboardTools = function() {
            let mList = window.currentUserData.mistakeBank || [];
            let fList = window.currentUserData.favoriteBank || [];
            
            const btnM = document.getElementById('btn-mistake');
            const btnF = document.getElementById('btn-favorite');
            
            if(mList.length > 0) {
                btnM.style.display = 'inline-block';
                document.getElementById('mistake-count').innerText = mList.length;
            } else btnM.style.display = 'none';

            if(fList.length > 0) {
                btnF.style.display = 'inline-block';
                document.getElementById('favorite-count').innerText = fList.length;
            } else btnF.style.display = 'none';
        }

        function deleteCardItem(id) {
            if(!confirm("確定要從此清單中刪除這題嗎？")) return;
            if(!confirm("再次確認：刪除後將無法恢復！")) return;
            
            if(quizState.mode === 'mistake') {
                let list = window.currentUserData.mistakeBank || [];
                const newList = list.filter(x => x !== id);
                if(window.updateUserData) window.updateUserData('mistakeBank', newList);
                quizState.qIds = newList;
            } else if (quizState.mode === 'favorite') {
                let list = window.currentUserData.favoriteBank || [];
                const newList = list.filter(x => x !== id);
                if(window.updateUserData) window.updateUserData('favoriteBank', newList);
                quizState.qIds = newList;
            }

            const card = document.getElementById(`card-${id}`);
            if(card) card.remove();
            
            if(window.updateUserData) window.updateUserData('waterfallProgress_' + quizState.mode, quizState);
            window.updateWaterfallStats();
            window.updateDashboardTools();
            
            if(quizState.qIds.length === 0) {
                alert("清單已空！");
                exitQuiz();
            }
        }

        function exitQuiz() {
            if(confirm("確定要離開速讀區？(系統會自動儲存目前的進度)")) {
                // 原本會記錄分數歷史，如果只需要保留進度，則直接回首頁
                goToDashboard();
            }
        }

        function restartQuiz() {
            if (!confirm("確定要重新開始嗎？所有進度將被清除！")) return;
            if (!confirm("再次確認：清除後無法復原，確定重新開始？")) return;

            if(window.updateUserData) window.updateUserData('waterfallProgress_' + quizState.mode, null);
            startWaterfallQuiz(quizState.mode, true);
        }
        
        function logout() { location.reload(); }

    </script>
</body>
</html>
